# Local PostgreSQL for development. Not for production use as-is.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: inboxzero
      POSTGRES_PASSWORD: inboxzero
      POSTGRES_DB: inboxzero
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
